<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人机验证</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#f1f3f4;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
}

/* 验证框 */
#verify{
    width:340px;
    height:78px;
    background:#fff;
    border:1px solid #dcdcdc;
    border-radius:4px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    transition:.2s;
}

#verify:hover{
    box-shadow:0 5px 15px rgba(0,0,0,.18);
}

/* 左侧 */
.left{
    display:flex;
    align-items:center;
    gap:15px;
}

.checkbox{
    width:28px;
    height:28px;
    border:2px solid #888;
    border-radius:3px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    color:#2d7ef7;
    transition:.2s;
}

.text{
    font-size:18px;
    color:#333;
}

/* 右侧 */
.right{
    width:72px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    user-select:none;
}

.logo{
    width:36px;
    height:36px;
    object-fit:contain;
    margin-bottom:4px;
}

.logo-text{
    font-size:10px;
    color:#777;
    text-align:center;
    line-height:1.2;
}

/* 视频 */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    background:#000;
}
</style>

</head>
<body>

<div id="verify">
    <div class="left">
        <div class="checkbox" id="box"></div>
        <div class="text">我不是机器人</div>
    </div>

    <div class="right">
        <img src="logo.png" class="logo" alt="Logo">
        <div class="logo-text">
            人机验证
        </div>
    </div>
</div>

<video id="video" src="video.mp4" playsinline></video>

<script>
const verify = document.getElementById("verify");
const video = document.getElementById("video");
const box = document.getElementById("box");

verify.onclick = async () => {

    // 打勾动画
    box.innerHTML = "✓";
    box.style.borderColor = "#2d7ef7";

    // 停顿一下，更像验证
    setTimeout(async () => {

        verify.style.display = "none";
        video.style.display = "block";

        try{
            await video.play();
        }catch(e){
            alert("播放失败：" + e.message);
        }

    },800);
}
</script>

</body>
</html>
